<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Taal Tarang Admin</title><style>body{font-family:Arial,sans-serif;margin:32px;background:#fff8ee;color:#27213b}h1{margin-bottom:6px}p{color:#5c5667}table{border-collapse:collapse;width:100%;background:#fff;margin-top:24px;font-size:14px}th,td{border:1px solid #d7d2d7;padding:10px;text-align:left;vertical-align:top;white-space:pre-wrap}th{background:#6a2a74;color:#fff;position:sticky;top:0}.wrap{overflow:auto}button{background:#b54824;color:white;border:0;border-radius:7px;padding:10px 14px;font-weight:bold;cursor:pointer}</style></head>
<body><h1>TAAL TARANG — Admin</h1><p>Submitted registrations. Refresh to load the latest responses.</p><button onclick="loadRegistrations()">Refresh data</button><div class="wrap"><table id="table"></table></div><script>
async function loadRegistrations(){const response=await fetch('/api/admin/registrations',{credentials:'same-origin'});if(!response.ok){document.querySelector('#table').innerHTML='<caption>Could not load registrations. Please sign in again.</caption>';return}const records=await response.json();const columns=[...new Set(records.flatMap(Object.keys))];const cell=(value)=>String(value??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));document.querySelector('#table').innerHTML=`<thead><tr>${columns.map(c=>`<th>${cell(c)}</th>`).join('')}</tr></thead><tbody>${records.map(r=>`<tr>${columns.map(c=>`<td>${cell(Array.isArray(r[c])?r[c].join(', '):r[c])}</td>`).join('')}</tr>`).join('')}</tbody>`}loadRegistrations();
</script></body></html>
